<script>
const T=THREE,$=id=>document.getElementById(id),V=(x,y,z)=>new T.Vector3(x,y,z);
const C={act:0x2f6fdb,rod:0xd8dde5,bat:0x2b3340,sw:0x22b36b,fuse:0xf2a516,hinge:0xf26a1b,frame:0x8d97a6,lock:0xf5d20a,stop:0xe53935,seat:0x2a3f66,cabR:0xd62828,cabK:0x15181d};
[['12 V lineær aktuator',C.act],['12 V batteri',C.bat],['DPDT-momentafbryder (armlæn)',C.sw],['Sikring + holder',C.fuse],['Kraftige kabler (rød/sort)',C.cabR],['Hængsler/led i saksen',C.hinge],['Stål-/alu-ramme',C.frame],['Mekanisk sikkerhedslås',C.lock],['Person med ét ben (højre ben)',0xe0b08a],['Fysiske endestop + støtteben (røde)',C.stop]]
.forEach(([n,c])=>{const l=document.createElement('li');l.innerHTML='<i style="background:#'+c.toString(16).padStart(6,'0')+'"></i>'+n;$('leg').appendChild(l)});

const cv=$('c'),R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.05,700);
scene.add(new T.HemisphereLight(0xffffff,0x667088,.85));
const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(2,3,2.5);scene.add(dl);
const grid=new T.GridHelper(12,120,0x8a93a3,0xaab1be);grid.material.transparent=true;grid.material.opacity=.45;scene.add(grid);

const mat={};const M=c=>mat[c]||(mat[c]=new T.MeshStandardMaterial({color:c,roughness:.55,metalness:.3}));
function box(w,h,d,c,x,y,z,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m}
function cyl(r,h,c,x,y,z,p,ax){const m=new T.Mesh(new T.CylinderGeometry(r,r,h,18),M(c));if(ax==='z')m.rotation.x=Math.PI/2;m.position.set(x,y,z);(p||scene).add(m);return m}

// By
const blds=[];const SKY=0x9db3cc;scene.background=new T.Color(SKY);scene.fog=new T.Fog(SKY,60,270);grid.visible=false;
const CH=120,PITCH=30,BLK=22,world=new T.Group();scene.add(world);let gs=0;
const sstep=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function urb(x,z){return .5+.3*Math.sin(x*.0065+1.3)*Math.cos(z*.0058+.7)+.2*Math.sin((x*.9+z*1.1)*.0125+2)+1.2*Math.max(0,1-Math.hypot(x,z)/300)}
function hf(x,z){const hb=1.4*(18*Math.sin(x*.021+1.7)*Math.cos(z*.017)+10*Math.sin(x*.047+z*.039+2)+5*Math.sin(x*.11-z*.09))+4;return Math.max(0,hb)*(1-sstep(.4,.6,urb(x,z)))}
const worldUpd=(function(){
  const c2=document.createElement('canvas');c2.width=c2.height=64;const g2=c2.getContext('2d');
  g2.fillStyle='#e9ecef';g2.fillRect(0,0,64,64);g2.fillStyle='#5f7f9f';g2.fillRect(14,14,36,30);g2.fillStyle='#8fb0cf';g2.fillRect(14,14,36,10);
  const tex=new T.CanvasTexture(c2);tex.wrapS=tex.wrapT=T.RepeatWrapping;
  const wm=[0xcfd6e0,0xbfc7d4,0xe2d8c8,0xaab6c8,0xd9cbbf,0x9fb0c2].map(c=>new T.MeshStandardMaterial({color:c,map:tex,roughness:.8}));
  const roof=new T.MeshStandardMaterial({color:0x6b7280,roughness:.9});
  const tm=new T.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0}),slabG=new T.BoxGeometry(BLK,.3,BLK),slabM=M(0x8d939c),coneG=new T.ConeGeometry(2,6,7),treeM=new T.MeshStandardMaterial({color:0x2f6b3a,roughness:.9});
  const chunks=new Map(),A=new T.Color(0x353a42),G=new T.Color(0x4f8a4a),Rk=new T.Color(0x8a8f8c),S=new T.Color(0xeef1f4),cc=new T.Color();let tick=0;
  function bld(w,h,d,x,y,z,mi,rnd,g,key){
    if(gone.has(Math.round(x*10)+','+Math.round(z*10)))return null;
    const geo=new T.BoxGeometry(w,h,d),uv=geo.attributes.uv;
    for(let f=0;f<6;f++)for(let i=f*4;i<f*4+4;i++){uv.setXY(i,uv.getX(i)*(f<2?d:w)/4,uv.getY(i)*((f<2||f>3)?h:d)/4)}
    const w0=wm[mi!=null?mi:Math.floor(rnd()*wm.length)];
    const m=new T.Mesh(geo,[w0,w0,roof,roof,w0,w0]);m.position.set(x,y+h/2,z);g.add(m);blds.push({m,x,z,w,d,h,top:y+h,alive:true,ch:key});return m;
  }
  function build(ci,cj){
    const key=ci+','+cj,cx=ci*CH,cz=cj*CH,g=new T.Group();world.add(g);
    let sd=(((ci*92837111)^(cj*689287499))>>>0)%2147483646+1;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
    const geo=new T.PlaneGeometry(CH,CH,16,16);geo.rotateX(-Math.PI/2);
    const p=geo.attributes.position,col=new Float32Array(p.count*3);
    for(let v=0;v<p.count;v++){const x=cx+p.getX(v),z=cz+p.getZ(v),h=hf(x,z);p.setY(v,h);
      cc.copy(G).lerp(Rk,sstep(18,34,h)).lerp(S,sstep(38,50,h)).lerp(A,sstep(.4,.6,urb(x,z)));col.set([cc.r,cc.g,cc.b],v*3)}
    geo.setAttribute('color',new T.BufferAttribute(col,3));geo.computeVertexNormals();
    const tr=new T.Mesh(geo,tm);tr.position.set(cx,0,cz);g.add(tr);
    const tp=[];for(let k=0;k<70;k++){const x=cx+(rnd()-.5)*CH,z=cz+(rnd()-.5)*CH,h=hf(x,z);if(urb(x,z)<.5&&h>.5&&h<32)tp.push([x,h,z,.7+rnd()*.9])}
    if(tp.length){const im=new T.InstancedMesh(coneG,treeM,tp.length),m4=new T.Matrix4();tp.forEach((t,k)=>{m4.makeScale(t[3],t[3],t[3]).setPosition(t[0],t[1]+3*t[3],t[2]);im.setMatrixAt(k,m4)});im.frustumCulled=false;g.add(im)}
    for(let i=4*ci-2;i<=4*ci+1;i++)for(let j=4*cj-2;j<=4*cj+1;j++){
      const bx=i*PITCH,bz=j*PITCH;if(urb(bx,bz)<.62)continue;
      if(i===0&&j===0){const pl=new T.Mesh(new T.BoxGeometry(BLK,.02,BLK),M(0xb9bec6));pl.position.set(0,.01,0);g.add(pl);
        [[-9,-9],[9,-9],[-9,9],[9,9],[-9,0],[9,0],[0,-9],[0,9]].forEach(([x,z])=>{
          const t=new T.Mesh(new T.CylinderGeometry(.12,.16,1.8,8),M(0x6b4a2f));t.position.set(x,.9,z);g.add(t);
          const c=new T.Mesh(new T.SphereGeometry(1.1,12,9),M(0x3f8a4a));c.position.set(x,2.6,z);g.add(c)});continue}
      const sl=new T.Mesh(slabG,slabM);sl.position.set(bx,.15,bz);g.add(sl);
      if(i===2&&j===0){[-1,1].forEach(q=>{const t=bld(10,150,10,bx,.3,bz+q*6,5,rnd,g,key);const an=new T.Mesh(new T.CylinderGeometry(.15,.3,18,8),M(0xd8dde5));an.position.y=84;t&&t.add(an)});continue}
      const dist=Math.min(5,Math.max(Math.abs(i),Math.abs(j)));
      [-1,1].forEach(a=>[-1,1].forEach(b=>{if(rnd()<.1)return;
        const w=6.5+rnd()*3,d=6.5+rnd()*3;let h=8+rnd()*18+dist*6*rnd();if(rnd()<.06)h+=35+rnd()*40;
        bld(w,h,d,bx+a*5.2+(rnd()-.5)*1.2,.3,bz+b*5.2+(rnd()-.5)*1.2,null,rnd,g,key)}));
    }
    chunks.set(key,{g,key,ci,cj});
  }
  function drop(c){world.remove(c.g);c.g.traverse(o=>{if(o.geometry&&o.geometry!==slabG&&o.geometry!==coneG)o.geometry.dispose()});
    for(let k=blds.length-1;k>=0;k--)if(blds[k].ch===c.key)blds.splice(k,1);chunks.delete(c.key)}
  return (x,z)=>{
    const ci=Math.round(x/CH),cj=Math.round(z/CH),RD=2;let ch=false;
    [...chunks.values()].forEach(c=>{if(Math.abs(c.ci-ci)>RD+1||Math.abs(c.cj-cj)>RD+1){drop(c);ch=true}});
    const need=[];for(let a=-RD;a<=RD;a++)for(let b=-RD;b<=RD;b++)if(!chunks.has((ci+a)+','+(cj+b)))need.push([ci+a,cj+b,a*a+b*b]);
    need.sort((p,q)=>p[2]-q[2]);need.slice(0,tick<40?4:1).forEach(([a,b])=>{build(a,b);ch=true});
    tick++;if(ch||!(tick%30))$('h5').textContent=destroyed+blds.filter(b=>b.alive).length;
  };
})();
const NCITY=scene.children.length,wheels=[];
// Ramme
const YB=.25,X0=-.1,LK=.55,N=13,A0=2.5*Math.PI/180,A1=46.5*Math.PI/180;

  box(1.55,.04,.04,C.frame,.175,.2,s*.27);

  box(.04,.11,.04,C.frame,-.2,.255,s*.31);             // akselbæring
  cyl(.012,.12,C.frame,.9,.15,s*.27);cyl(.08,.04,C.seat,.9,.08,s*.27,null,'z'); // caster
  const w=new T.Group();w.position.set(-.2,.3,s*.36);scene.add(w);wheels.push(w);
  w.add(new T.Mesh(new T.TorusGeometry(.3,.02,10,40),M(0x1b1e24)));
  const rim=new T.Mesh(new T.TorusGeometry(.255,.007,8,40),M(C.rod));rim.position.z=s*.03;w.add(rim);
  cyl(.03,.05,C.rod,0,0,0,w,'z');
  for(let i=0;i<8;i++){const sp=box(.005,.5,.005,C.rod,0,0,0,w);sp.rotation.z=i*Math.PI/8}
  box(.05,.05,.04,C.stop,.225,.245,s*.27);box(.05,.05,.04,C.stop,.505,.245,s*.27); // endestop
  box(.02,.12,.02,C.frame,.8,.26,s*.15);box(.02,.12,.02,C.frame,.9,.26,s*.15);      // fodstøtte-stolper
});
[-.6,-.3,-.1,.35,.75,.95,.5].forEach(x=>box(.04,.04,.58,C.frame,x,.2,0));
cyl(.012,.58,C.frame,-.2,.3,0,null,'z');
box(.26,.02,.38,C.seat,.85,.33,0);                      // fast fodstøtte

box(.14,.14,.2,C.bat,-.28,.29,0);box(.142,.03,.202,C.stop,-.28,.33,0);
box(.06,.035,.045,C.fuse,-.28,.37,.05);

// Saksemekanisme (13 trin)
const links=[],hinges=[];
[-1,1].forEach(s=>{

    const a=new T.Group(),b=new T.Group();scene.add(a);scene.add(b);

});
const cross=cyl(.015,.5,C.frame,0,0,0,null,'z');
// Sædeenhed

const sg=new T.Group();scene.add(sg);cyl(.16,.03,C.hinge,.1,0,0,sg); // drejeskive

const bk=box(.04,.42,.4,C.seat,-.12,.27,0,sg);bk.rotation.z=.08;
[-1,1].forEach(s=>{box(.02,.2,.02,C.frame,0,.13,s*.22,sg);box(.3,.03,.04,C.seat,.1,.24,s*.22,sg)});
box(.07,.04,.05,C.sw,.17,.275,.22,sg);
const lever=cyl(.006,.05,0x111111,.17,.3,.22,sg);

// Person med ét ben (sidder på sædet)
const SK=0xe0b08a,SH=0x3d8f7a,PA=0x3b4252,SO=0x1b1e24;
function limb(a,b,rad,c,p){const A=V(...a),B=V(...b),d=B.clone().sub(A),m=new T.Mesh(new T.CylinderGeometry(rad,rad,d.length(),14),M(c));

const person=new T.Group();sg.add(person);
box(.2,.44,.32,SH,-.02,.31,0,person);                       // overkrop

limb([0,.55,0],[0,.62,0],.04,SK,person);                    // hals

limb([.5,.135,.1],[.92,.09,.1],.055,PA,person);             // underben
box(.17,.07,.1,SO,.99,.07,.1,person);                       // sko
limb([.04,.14,-.1],[.27,.14,-.1],.07,PA,person);            // venstre lår slutter her
box(.35,.03,.16,C.frame,.9,.015,.1,sg);                     // benstøtte
limb([-.02,.5,.19],[0,.3,.2],.04,SH,person);limb([0,.3,.2],[.2,.29,.2],.033,SK,person);     // højre arm (hånd på kontakten)
limb([-.02,.5,-.19],[0,.3,-.2],.04,SH,person);limb([0,.3,-.2],[.2,.29,-.2],.033,SK,person); // venstre arm

// Ansigt
[-1,1].forEach(z=>{const e=new T.Mesh(new T.SphereGeometry(.014,10,8),M(0x111111));e.position.set(.088,.72,z*.04);person.add(e);
  box(.012,.006,.03,0x4a2f1c,.092,.742,z*.04,person)});
const nose=new T.Mesh(new T.SphereGeometry(.016,10,8),M(0xcf9a74));nose.position.set(.102,.69,0);person.add(nose);
box(.01,.01,.05,0xa8483f,.094,.652,0,person);

  for(let i=0;i<150&&!window.mpReady;i++)await new Promise(r=>setTimeout(r,100));if(!window.mpReady)return;room=await window.mpReady;if(!room)return;
  room.onPeers(({peers})=>{const ids=new Set();peers.forEach(p=>{if(p.isMe||p.kind!=='viewer')return;ids.add(p.peer);(ghosts.get(p.peer)||mkGhost(p.peer)).pr=p.presence});
    ghosts.forEach((gh,id)=>{if(!ids.has(id)){gh.dead=true;scene.remove(gh.g);ghosts.delete(id)}});$('pl').textContent=1+ids.size});

  room.on('dest',m=>{if(m.isMe)return;const k=m.data&&m.data.k;if(typeof k!=='string'||k.length>30)return;gone.add(k);const b=blds.find(b=>b.alive&&bkey(b)===k);if(b)destroyB(b,true)});
}catch(e){room=null}})();
function fun(dt){
  const cp=chair.position;ghostStep(dt,cp);
  comboT-=dt;if(comboT<=0)combo=0;boostT-=dt;shake*=Math.pow(.02,dt);flash*=Math.pow(.05,dt);hp=Math.min(100,hp+dt);
  spawnT-=dt;if(spawnT<=0&&drones.filter(d=>!d.dead).length<4){mkDrone();spawnT=2.5}
  for(let i=drones.length-1;i>=0;i--){const d=drones[i];if(d.dead){drones.splice(i,1);continue}
    const g=d.g,k=Math.min(1,dt*.9);d.ph+=dt*.5;
    g.position.x+=(cp.x+Math.cos(d.ph)*32-g.position.x)*k;g.position.z+=(cp.z+Math.sin(d.ph)*32-g.position.z)*k;
    g.position.y+=(Math.max(hf(g.position.x,g.position.z)+5,cp.y+7)-g.position.y)*k;g.rotation.y+=dt*4;
    d.cd-=dt;if(d.cd<=0&&g.position.distanceTo(cp)<80){d.cd=1.6+Math.random();
      const m=new T.Mesh(sphG,new T.MeshBasicMaterial({color:0xff5a1f}));m.scale.setScalar(.35);m.position.copy(g.position);scene.add(m);
      bolts.push({m,dr:cp.clone().add(V(0,1,0)).sub(g.position).normalize(),life:5})}}
  for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.m.position.addScaledVector(b.dr,30*dt);b.life-=dt;
    if(b.m.position.distanceTo(cp)<2.2){hurt(8);b.life=0}
    if(b.life<=0){scene.remove(b.m);b.m.material.dispose();bolts.splice(i,1)}}
  while(rings.length<6)mkRing();
  for(let i=rings.length-1;i>=0;i--){const m=rings[i],dd=m.position.distanceTo(cp);m.rotation.z+=dt;
    if(dd<5.5){addScore(100);boostT=2.5;hp=Math.min(100,hp+10);toast('⭕ RING +100 · BOOST!');boom(m.position.clone(),false);scene.remove(m);rings.splice(i,1)}
    else if(dd>220){scene.remove(m);rings.splice(i,1)}}
  if(metOn){metT-=dt;if(metT<=0){metT=.5;const m=new T.Mesh(sphG,new T.MeshBasicMaterial({color:0xff7a1a}));m.scale.setScalar(1.6);m.position.set(cp.x+rn(160),cp.y+130,cp.z+rn(160));scene.add(m);mets.push({m,v:V(rn(20),-55,rn(20))})}}
  for(let i=mets.length-1;i>=0;i--){const t=mets[i],p=t.m.position;p.addScaledVector(t.v,dt);if(Math.random()<.5)puff(p.clone(),V(0,0,0),0xffa040,.7,1.2,.2,.7,0);
    let hit=p.y<hf(p.x,p.z)+.5;if(!hit)for(const b of blds)if(b.alive&&Math.abs(p.x-b.x)<b.w/2&&Math.abs(p.z-b.z)<b.d/2&&p.y<b.top){hit=true;break}
    if(hit){explode(p.clone(),14);scene.remove(t.m);mets.splice(i,1)}}
  msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;
  $('sc').textContent=score;$('cb').textContent=1+Math.floor(combo/3);$('hp').textContent=Math.round(hp);$('fl').style.opacity=flash*.5;
}
$('rk').onclick=()=>{if(manual){manual=false;rocketsOn=true;phi=Math.atan2(pz,px)}else rocketsOn=!rocketsOn;syncBtn()};
const KM={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyQ:'q',KeyE:'e',Space:'up',KeyC:'dn',KeyF:'f',KeyG:'g',ShiftLeft:'shift',ShiftRight:'shift'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k||e.ctrlKey||e.metaKey||e.altKey)return;if('wasd'.includes(k)&&k.length===1)enterManual();keys[k]=true;e.preventDefault()});

document.querySelectorAll('#pad button,#pad2 button').forEach(b=>{const k=b.dataset.k,on=e=>{if('wasd'.includes(k)&&k.length===1)enterManual();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}},off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});

[['sm',v=>{mast=v/100;return Math.round(v)+' %'},'vm'],['su',v=>{upS=+v;return fmt(v)+' s'},'vu'],['sd',v=>{dnS=+v;return fmt(v)+' s'},'vd'],['sr',v=>{rpm=+v;return Math.round(v)+' o/min'},'vr']]
.forEach(([id,fn,out])=>{const el=$(id),f=()=>{$(out).textContent=fn(+el.value)};el.addEventListener('input',f);f()});
// Tilstand
let spinA=0,spinOn=true,th=A0+.15,dir=0,locked=false,two=false,demo=false;

function update(){
  const c=Math.cos(th),s=Math.sin(th),h=LK*s,W=LK*c;
  links.forEach(l=>{const y=YB+l.k*h;l.a.position.set(X0,y,l.a.position.z);l.a.rotation.z=th;l.b.position.set(X0+W,y,l.b.position.z);l.b.rotation.z=Math.PI-th});
  hinges.forEach(o=>{const m=o.m;if(o.t==='L')m.position.set(X0,YB+o.j*h,m.position.z);else if(o.t==='R')m.position.set(X0+W,YB+o.j*h,m.position.z);else m.position.set(X0+W/2,YB+(o.j+.5)*h,m.position.z)});
  const fr=(th-A0)/(A1-A0);outs.forEach(o=>{const e=.15+1.35*fr;o.arm.scale.x=e;o.arm.rotation.y=Math.PI/2;o.arm.position.z=o.sd*(.3+e/2);o.foot.position.z=o.sd*(.3+e)});
  const top=YB+N*h;plate.position.set(X0,top,0);sg.rotation.y=spinA;sg.position.set(X0+.1-.1*Math.cos(spinA),top+.03,.1*Math.sin(spinA));sg.updateMatrixWorld(true);
  const Q=new T.Vector2(X0+W,YB+h);cross.position.set(Q.x,Q.y,0);
  const dx=Q.x-P.x,dy=Q.y-P.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
  acts.forEach(a=>{a.position.set(P.x,P.y,a.userData.z);a.rotation.z=ang-Math.PI/2;const r=a.userData.rod;r.scale.y=len-.15;r.position.y=.15+(len-.15)/2});
  lever.rotation.z=-dir*.6;lever.position.x=.17+dir*.012;
  chair.updateMatrixWorld(true);sg.localToWorld(swW.set(.17,.3,.22));chair.worldToLocal(swW);
  cabs.forEach(f=>f());
  $('h1').textContent=Math.round(N*LK*(s-Math.sin(A0))*1000);
  $('h2').textContent=Math.round(len*1000);
  const cx=X0+.07,mg=(cx+.2)*1000;cog.position.x=cx;cog.material.color.set(mg>80?0x22c55e:0xe53935);$('h3').textContent=Math.round(mg);
}
function setLock(on){
  locked=on;$('lock').classList.toggle('on',on);
  ['up','dn','demo'].forEach(i=>$(i).disabled=on);
  if(on){demo=false;$('demo').classList.remove('on');dir=0;
    const yt=YB+N*LK*Math.sin(th),yb=.22;

  else lockM.forEach(m=>m.visible=false);

}
$('lock').onclick=()=>setLock(!locked);
$('spin').onclick=()=>{spinOn=!spinOn;$('spin').classList.toggle('on',spinOn)};
$('two').onclick=()=>{two=!two;$('two').classList.toggle('on',two);setAct()};
$('demo').onclick=()=>{demo=!demo;$('demo').classList.toggle('on',demo);dir=demo?1:0};
[['up',1],['dn',-1]].forEach(([id,d])=>{const b=$(id);
  const on=e=>{if(locked)return;demo=false;$('demo').classList.remove('on');dir=d;try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{if(!demo)dir=0};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
addEventListener('keydown',e=>{if(locked)return;if(e.key==='ArrowUp')dir=1;if(e.key==='ArrowDown')dir=-1});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown')dir=demo?dir:0});

// Kamera (træk = roter, hjul/knib = zoom)
let az=.9,el=.12,dist=14;const tgt=V(.15,2.7,0),ptrs=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
cv.addEventListener('pointerup',e=>ptrs.delete(e.pointerId));cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId);
  if(ptrs.size===1){az-=(e.clientX-o[0])*.008;el=Math.max(-.1,Math.min(1.4,el+(e.clientY-o[1])*.006))}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)dist=Math.max(1,Math.min(60,dist*pd/d));pd=d}
});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1,Math.min(60,dist*(1+Math.sign(e.deltaY)*.08)))},{passive:false});
function size(){const r=cv.parentNode.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}

let last=performance.now();
(function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(spinOn&&!locked)spinA=(spinA+dt*mast*rpm/60*2*Math.PI)%(2*Math.PI);
  if(!locked&&dir){th+=dir*mast*(A1-A0)/(dir>0?upS:dnS)*dt;if(th>=A1){th=A1;if(demo)dir=-1}if(th<=A0){th=A0;if(demo)dir=1}}
  motion(dt);worldUpd(chair.position.x,chair.position.z);combat(dt);fun(dt);update();
  cam.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(el)*Math.cos(az));
  cam.position.x+=rn(shake);cam.position.y+=rn(shake);cam.position.z+=rn(shake);
  const cg=hf(cam.position.x,cam.position.z)+1.5;if(cam.position.y<cg)cam.position.y=cg;
  const fv=(manual&&(keys.shift||boostT>0)&&vCur>5)?62:40;cam.fov+=(fv-cam.fov)*.08;cam.updateProjectionMatrix();cam.lookAt(tgt);R.render(scene,cam);renderFace();requestAnimationFrame(loop);
})(last);

<script>
(function(){
let ok;window.mpReady=new Promise(r=>ok=r);
const sm=document.querySelector('#hud small');if(sm)sm.insertAdjacentHTML('afterend','<br><span id="net">🌐 forbinder…</span>');
const st=t=>{const e=document.getElementById('net');if(e)e.textContent='🌐 '+t};
const code=(new URLSearchParams(location.search).get('rum')||'offentlig').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,30)||'offentlig',HID='koerestol3d-'+code;
const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
sc.onerror=()=>{st('kunne ikke hente PeerJS');ok(null)};
sc.onload=()=>{
  let myId=null,isHost=false,hostConn=null;const conns=new Map(),peers=new Map(),lis=[],topics={};
  const notify=()=>{const arr=[...peers.entries()].map(([id,pr])=>({peer:id,isMe:false,kind:'viewer',presence:pr}));lis.forEach(f=>f({peers:arr}));st((isHost?'vært':'forbundet')+' · rum '+code+' · '+arr.length+' andre')};
  function gotMsg(d){
    if(!d||typeof d!=='object'||typeof d.id!=='string'||d.id===myId)return;
    if(d.k==='pos'&&d.p&&typeof d.p==='object'){peers.set(d.id,d.p);notify()}
    else if(d.k==='evt'&&typeof d.t==='string'){(topics[d.t]||[]).forEach(f=>f({isMe:false,kind:'viewer',peer:d.id,data:d.d}))}
    else if(d.k==='bye'){peers.delete(d.id);notify()}
  }
  function send(d){d.id=myId;if(isHost)conns.forEach(c=>c.open&&c.send(d));else if(hostConn&&hostConn.open)hostConn.send(d)}
  function start(){
    isHost=false;const p=new Peer(HID);
    p.on('open',id=>{myId=id;isHost=true;st('vært · rum '+code+' · 0 andre')});
    p.on('connection',c=>{
      c.on('open',()=>conns.set(c.peer,c));
      c.on('data',d=>{gotMsg(d);conns.forEach(o=>{if(o!==c&&o.open)o.send(d)})});
      c.on('close',()=>{conns.delete(c.peer);peers.delete(c.peer);conns.forEach(o=>o.open&&o.send({k:'bye',id:c.peer}));notify()});
    });
    p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();join()}else st('fejl: '+e.type)});
  }
  function join(){
    const p=new Peer();
    p.on('open',id=>{myId=id;const c=p.connect(HID,{serialization:'json'});
      c.on('open',()=>{hostConn=c;isHost=false;st('forbundet · rum '+code)});
      c.on('data',gotMsg);
      c.on('close',()=>{hostConn=null;peers.clear();notify();st('mistede forbindelsen…');p.destroy();setTimeout(start,1000+Math.random()*2000)})});
    p.on('error',e=>{if(e.type==='peer-unavailable'){p.destroy();setTimeout(start,500+Math.random()*1000)}else st('fejl: '+e.type)});
  }
  start();
  ok({emit:(t,d)=>{if(myId)send({k:'evt',t,d});return Promise.resolve()},presence:p=>{if(myId)send({k:'pos',p});return Promise.resolve()},onPeers:f=>{lis.push(f)},on:(t,f)=>{(topics[t]=topics[t]||[]).push(f)}});
};
document.head.appendChild(sc);
})();
</script>
